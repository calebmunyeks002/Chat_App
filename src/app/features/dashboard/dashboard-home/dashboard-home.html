<div class="dashboard-home">

    <div class="left-side">

        <h3>
            Welcome back,
            <span>{{ userName }}</span> 👋
        </h3>

        <h1>
            Let's Connect
            <span>and Chat!</span>
        </h1>

        <p>
            FinChat brings teams and communities together.
            Create rooms, collaborate securely and communicate in real time.
        </p>

        <div class="stats">

            <div class="card">
                <h2>{{ totalRooms }}</h2>
                <p>Total Rooms</p>
            </div>

            <div class="card">
                <h2>{{ totalMessages }}</h2>
                <p>Total Messages</p>
            </div>

            <div class="card">
                <h2>{{ onlineUsers }}</h2>
                <p>Online Users</p>
            </div>

        </div>

    </div>

    <div class="right-side">

        <img
            src="dashboard-office.png"
            alt="Office Collaboration">

    </div>

</div>
