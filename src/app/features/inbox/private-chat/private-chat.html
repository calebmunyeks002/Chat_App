<div class="chat-window">

  <!-- =======================================
       CHAT HEADER
  ======================================== -->

  <div class="chat-header">

    <div class="left-header">

      <button
        class="back-btn"
        (click)="goBack()">

        ←

      </button>

      <img
        class="profile"
        [src]="chatUser.avatar"
        alt="Profile">

      <div class="user-info">

        <h2>{{ chatUser.name }}</h2>

        <small *ngIf="chatUser.online">

          🟢 Online

        </small>

        <small *ngIf="!chatUser.online">

          ⚪ Offline

        </small>

      </div>

    </div>

    <div class="header-actions">

      <button
        title="Voice Call"
        (click)="startVoiceCall()">

        📞

      </button>

      <button
        title="Video Call"
        (click)="startVideoCall()">

        🎥

      </button>

      <button
        title="More"
        (click)="openMoreMenu()">

        ⋮

      </button>

    </div>

  </div>

  <!-- =======================================
       SEARCH BAR
  ======================================== -->

  <div class="search-bar">

    <input

      type="text"

      placeholder="Search messages..."

      [(ngModel)]="searchText">

  </div>

  <!-- =======================================
       CHAT BODY
  ======================================== -->

  <div
    class="messages"
    #scrollContainer>

    <div

      *ngFor="let msg of filteredMessages"

      class="message-row"

      [class.mine]="msg.mine">

      <!-- Avatar -->

      <img

        *ngIf="!msg.mine"

        class="avatar"

        [src]="chatUser.avatar"

        alt="Avatar">

      <!-- Bubble -->

      <div

        class="bubble"

        [class.mine]="msg.mine">

        <!-- Image -->

        <img

          *ngIf="msg.image"

          class="message-image"

          [src]="msg.image"

          alt="Shared Image">

        <!-- Message -->

        <p>

          {{ msg.message }}

        </p>

        <!-- Footer -->

        <div class="message-footer">

          <small>

            {{ msg.time }}

          </small>

          <span *ngIf="msg.mine">

            {{ msg.status }}

          </span>

        </div>

        <!-- Reaction -->

        <div

          *ngIf="msg.reaction"

          class="reaction-display">

          {{ msg.reaction }}

        </div>

        <!-- Emoji Reactions -->

        <div class="reaction-buttons">

          <button (click)="react(msg,'👍')">

            👍

          </button>

          <button (click)="react(msg,'❤️')">

            ❤️

          </button>

          <button (click)="react(msg,'😂')">

            😂

          </button>

          <button (click)="react(msg,'🔥')">

            🔥

          </button>

        </div>

        <!-- Edit/Delete -->

        <div

          *ngIf="msg.mine"

          class="message-actions">

          <button
            (click)="editMessage(msg)">

            ✏ Edit

          </button>

          <button
            (click)="deleteMessage(msg.id)">

            🗑 Delete

          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- =======================================
       IMAGE PREVIEW
  ======================================== -->

  <div

    *ngIf="selectedImage"

    class="image-preview">

    <img

      [src]="selectedImage"

      alt="Preview">

    <button

      (click)="removeSelectedImage()">

      ✖ Remove

    </button>

  </div>

  <!-- =======================================
       EMOJI BAR
  ======================================== -->

  <div class="emoji-bar">

    <button

      *ngFor="let emoji of emojis"

      (click)="addEmoji(emoji)">

      {{ emoji }}

    </button>

  </div>

  <!-- =======================================
       MESSAGE INPUT
  ======================================== -->

  <div class="message-box">

    <!-- Attachment -->

    <label class="attachment">

      📎

      <input

        hidden

        type="file"

        accept="image/*"

        (change)="onImageSelected($event)">

    </label>

    <!-- Input -->

    <input

      type="text"

      placeholder="Type your message..."

      [(ngModel)]="newMessage"

      (keyup)="onTyping()"

      (keyup.enter)="sendMessage()">

    <!-- Send -->

    <button

      class="send-btn"

      (click)="sendMessage()">

      ➤

    </button>

  </div>

</div>
